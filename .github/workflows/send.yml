name: Telegram xabar yuborish

on:
  schedule:
    # Maqsad: har kuni London vaqti bilan ~21:00.
    # GitHub cron faqat UTC biladi, UK esa yozda (BST) UTC+1, qishda (GMT) UTC+0.
    # Shuning uchun ikkita vaqt qo'yilgan, "Vaqtni tekshirish" qadami
    # hozirgi faslga mos kelmaydiganini o'tkazib yuboradi. Kuniga bitta xabar ketadi.
    # GitHub odatda 5-15 daqiqa kechikadi, shuning uchun 20:55 ga qo'yilgan.
    - cron: "55 19 * * *" # 20:55 London, yozgi vaqt (BST)
    - cron: "55 20 * * *" # 20:55 London, qishki vaqt (GMT)
  workflow_dispatch: # "Run workflow" tugmasi bilan qo'lda ishga tushirish

concurrency:
  group: telegram-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vaqtni tekshirish
        id: gate
        run: |
          OFFSET=$(TZ=Europe/London date +%z)
          echo "London UTC offset: $OFFSET, trigger: '${{ github.event.schedule }}'"
          RUN=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "55 19 * * *" ] && [ "$OFFSET" != "+0100" ]; then RUN=no; fi
            if [ "${{ github.event.schedule }}" = "55 20 * * *" ] && [ "$OFFSET" != "+0000" ]; then RUN=no; fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Yuboriladimi: $RUN"

      - if: steps.gate.outputs.run == 'yes'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.run == 'yes'
        run: python send.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
