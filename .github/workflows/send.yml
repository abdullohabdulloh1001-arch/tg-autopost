# BU FAYLNI BOT YOZADI. Vaqtni botdan o'zgartiring.
# Yuborish vaqti: 21:00 (Europe/London). GitHub odatda bir necha daqiqa kechikadi,
# shuning uchun 5 daqiqa oldinroq ishga tushiriladi.
# Ikki cron: biri yozgi (BST, UTC+1), biri qishki (GMT, UTC+0) vaqt uchun.
# gate.py hozirgi faslga mos kelmaganini o'tkazib yuboradi, kuniga bitta xabar ketadi.
name: Telegram xabar yuborish

on:
  schedule:
    - cron: "55 19 * * *" # BST
    - cron: "55 20 * * *" # GMT
  workflow_dispatch:
    inputs:
      test:
        description: "Faqat o'zimga (Saved Messages) yuborish"
        type: boolean
        default: false

concurrency:
  group: telegram-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Vaqtni tekshirish
        id: gate
        run: python3 gate.py
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}

      - if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'yes'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.run == 'yes'
        run: python send.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          TEST_MODE: ${{ github.event.inputs.test == 'true' && '1' || '' }}
